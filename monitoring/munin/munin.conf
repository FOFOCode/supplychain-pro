# Configuración del servidor Munin
# El servidor recolecta métricas del munin-node del backend
# y genera gráficas HTML en /var/cache/munin/www

# ─── Servidor global ─────────────────────────────────────────────────────────
[global]
# Directorio donde munin almacena las bases de datos RRD
dbdir     /var/lib/munin
# Directorio de logs
logdir    /var/log/munin
# Directorio de ejecución (PID files, etc.)
rundir    /var/run/munin
# Directorio de las gráficas HTML generadas
htmldir   /var/cache/munin/www
# Plantilla de contacto (sin alertas externas en la config base)
contact.default.command mail -s "Munin ${var:group} :: ${var:host}" root@localhost

# ─── Nodo a monitorear: backend ──────────────────────────────────────────────
[supplychainpro;backend]
# Nombre del servicio Docker del munin-node
address monitoring-munin-node
# Puerto estándar de munin-node
port    4949
use_node_name yes
