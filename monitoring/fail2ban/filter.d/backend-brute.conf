# Filtro Fail2ban — detecta intentos fallidos de login en el backend Node.js
# El backend debe loguear en formato:
#   ::ffff:1.2.3.4 - - [26/May/2025:14:03:12 +0000] "POST /api/auth/login HTTP/1.1" 401 -
# Formato compatible con morgan 'combined' o 'common'

[Definition]
failregex = ^<HOST> .+ "POST /api/auth/login HTTP/\S+" (401|403|429) .+$
ignoreregex =
