name: SupplyChain Pro - CI Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push: {}
  pull_request: {}

jobs:
  # ========== PARALLEL JOBS: Node.js Validation ==========

  validate-backend:
    name: Validate Backend (Lint + Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (with cache)
        working-directory: ./backend
        run: npm ci

      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint --silent

      - name: Run Tests
        working-directory: ./backend
        run: npm test

  validate-frontend:
    name: Validate Frontend (Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (with cache)
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Build Application
        working-directory: ./frontend
        run: npm run build

  validate-simulator:
    name: Validate Simulator (Lint + Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: simulator/package-lock.json

      - name: Install dependencies (with cache)
        working-directory: ./simulator
        run: npm ci

      - name: Run ESLint
        working-directory: ./simulator
        run: npm run lint --silent

      - name: Run Tests
        working-directory: ./simulator
        run: npm test

  # ========== PARALLEL JOBS: Docker Builds (depends on validation jobs) ==========

  build-docker-images:
    name: Build Docker Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [validate-backend, validate-frontend, validate-simulator]
    strategy:
      fail-fast: false
      matrix:
        service: [backend, simulator, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image with cache
        run: |
          docker buildx build \
            --cache-from type=gha,scope=supplychainpro-${{ matrix.service }} \
            --cache-to type=gha,mode=max,scope=supplychainpro-${{ matrix.service }} \
            -t supplychainpro-${{ matrix.service }}:ci \
            ./${{ matrix.service }}

  validate-compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    needs: [build-docker-images]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          cat > .env << 'EOF'
          DB_HOST=localhost
          DB_PORT=3306
          DB_NAME=supplychain_db
          DB_USER=supplychain_user
          DB_PASSWORD=supplychain_pass
          DB_ROOT_PASSWORD=supplychain_root_pass
          PORT=5000
          JWT_SECRET=ci_test_secret_do_not_use_in_prod
          BACKEND_URL=http://localhost:5000
          NODE_ENV=test
          ADMIN_EMAIL=admin@test.local
          ADMIN_PASSWORD=admin123
          SIM_STATE_PATH=/data
          SIMULATOR_URL=http://localhost:5002
          EOF

      - name: Validate docker-compose file
        run: docker compose config

  run-e2e-tests:
    name: Run E2E Tests (Selenium + Pytest)
    runs-on: ubuntu-latest
    needs: [build-docker-images]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          cat > .env << 'EOF'
          DB_HOST=localhost
          DB_PORT=3306
          DB_NAME=supplychain_db
          DB_USER=supplychain_user
          DB_PASSWORD=supplychain_pass
          DB_ROOT_PASSWORD=supplychain_root_pass
          PORT=5000
          BACKEND_HOST_PORT=5001
          PHPMYADMIN_HOST_PORT=8080
          NODE_ENV=test
          CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5001
          JWT_SECRET=ci_test_secret_do_not_use_in_prod
          BACKEND_URL=http://localhost:5000
          ADMIN_EMAIL=admin@test.local
          ADMIN_PASSWORD=admin123
          SIM_STATE_PATH=/data
          SIMULATOR_URL=http://localhost:3001
          EOF

      - name: Start Docker Environment
        run: docker compose up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to be fully healthy..."
          # Allow more time for DB migrations / image startup in CI
          sleep 10
          for i in {1..60}; do
            if curl -sSf http://localhost:5001/health >/dev/null 2>&1; then
              echo "Backend is healthy"
              break
            fi
            echo "Waiting for backend to become healthy... ($i/60)"
            sleep 2
          done
          # If still not healthy, print service status and recent logs to help debugging
          if ! curl -sSf http://localhost:5001/health >/dev/null 2>&1; then
            echo "Backend did not become healthy in time. Showing Docker Compose status and backend logs..."
            docker compose ps
            docker compose logs --no-color --tail=200 supplychainpro-backend || true
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Test Dependencies
        working-directory: ./tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run E2E Tests
        working-directory: ./tests
        env:
          FRONTEND_URL: http://localhost:5173
          API_BASE_URL: http://localhost:5001/api
          ADMIN_EMAIL: admin@test.local
          ADMIN_PASSWORD: admin123
        run: pytest -v
